name: Sync Bologna Repo

env:
  BRANCH_NAME: bologna

on:
  push:
    branches:
      - bologna

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          persist-credentials: "false"

      - name: Push to public Hello FPGA repository
        run: |
          git config --global user.email "hello-fpga@belfortlabs.com"
          git config --global user.name "Hello FPGA"
          git clone --branch ${{ env.BRANCH_NAME }} https://${{ secrets.HELLO_FPGA_CLASSIC }}@github.com/belfortlabs/hello-fpga.git
          cd hello-fpga
          git remote add internal https://${{ secrets.HELLO_FPGA_CLASSIC }}@github.com/belfortlabs/hello-fpga-internal.git
          git remote update
          git merge internal/${{ env.BRANCH_NAME }}
          # Remove .github directory from git tracking (entire folder, not just workflows)
          git rm -r --cached .github 2>/dev/null || true
          # Ensure .gitignore excludes .github directory
          if [ ! -f .gitignore ] || ! grep -q "^\.github$" .gitignore 2>/dev/null; then
            echo ".github" >> .gitignore
            git add .gitignore
          fi
          git commit --amend --no-edit
          git push origin ${{ env.BRANCH_NAME }}
